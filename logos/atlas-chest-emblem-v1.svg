<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Atlas Chest Emblem v1.0</title>
  <desc id="desc">Official Collectiverse Atlas blue hexagonal C chest emblem.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7DF6"/>
      <stop offset="0.48" stop-color="#005BFF"/>
      <stop offset="1" stop-color="#003A9B"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="0.22" stop-color="#AEB6C2"/>
      <stop offset="0.52" stop-color="#FFFFFF"/>
      <stop offset="0.78" stop-color="#7E8794"/>
      <stop offset="1" stop-color="#D8DDE5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer metallic badge -->
  <polygon points="256,24 456,140 456,372 256,488 56,372 56,140" fill="#101820" filter="url(#shadow)"/>
  <polygon points="256,44 438,150 438,362 256,468 74,362 74,150" fill="url(#metal)"/>
  <polygon points="256,74 412,164 412,348 256,438 100,348 100,164" fill="#111827"/>

  <!-- Blue field -->
  <polygon points="256,96 392,176 392,336 256,416 120,336 120,176" fill="url(#blue)"/>
  <polygon points="256,116 374,186 374,326 256,396 138,326 138,186" fill="#003FBA" opacity="0.28"/>

  <!-- White C mark -->
  <path d="M324 174
           C304 154 278 144 249 144
           C188 144 142 190 142 256
           C142 322 188 368 249 368
           C281 368 309 356 330 334
           L290 294
           C279 306 265 312 249 312
           C219 312 198 289 198 256
           C198 223 219 200 249 200
           C265 200 279 206 290 218
           L324 174 Z"
        fill="#FFFFFF"/>

  <!-- Subtle highlight -->
  <path d="M136 179 L256 110 L376 179" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.18" stroke-linecap="round"/>
</svg>
