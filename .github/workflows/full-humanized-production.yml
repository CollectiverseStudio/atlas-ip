name: Full Humanized Production

on:
  workflow_dispatch:
  push:
    branches: [reconciliation-canonical-v1]
    paths:
      - 'tools/pose-factory/full-production.request'

permissions:
  contents: write

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { faction: heroes, character: atlas }
          - { faction: heroes, character: pixel }
          - { faction: heroes, character: sterling }
          - { faction: heroes, character: forge }
          - { faction: heroes, character: porter }
          - { faction: heroes, character: echo }
          - { faction: villains, character: director }
          - { faction: villains, character: counterfeiter }
          - { faction: villains, character: restorer }
          - { faction: villains, character: hacker }
          - { faction: villains, character: hoarder }
          - { faction: villains, character: vault }
          - { faction: villains, character: whisper }
          - { faction: villains, character: smuggler }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - name: Generate missing poses
        run: npx tsx tools/pose-factory/scripts/generate-poses.ts --character=${{ matrix.character }}
      - name: QA generated poses
        run: npx tsx tools/pose-factory/scripts/qa-poses.ts --character=${{ matrix.character }}
      - name: Commit production results
        if: always()
        shell: bash
        run: |
          git config user.name 'collectiverse-pose-factory[bot]'
          git config user.email 'pose-factory@users.noreply.github.com'
          git add characters/${{ matrix.faction }}/${{ matrix.character }}/humanized/poses/ tools/pose-factory/qa/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "poses(${{ matrix.character }}): full humanized production and QA"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-production-${{ matrix.character }}
          path: |
            characters/${{ matrix.faction }}/${{ matrix.character }}/humanized/poses/
            tools/pose-factory/qa/${{ matrix.character }}-latest.json
          retention-days: 30
