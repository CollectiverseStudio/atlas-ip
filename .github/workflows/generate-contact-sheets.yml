name: Generate Canonical Contact Sheets

on:
  push:
    branches:
      - reconciliation-canonical-v1
    paths:
      - '.github/workflows/generate-contact-sheets.yml'
      - 'characters/*/*/humanized/poses/approved/*.png'
  workflow_dispatch:

concurrency:
  group: canonical-contact-sheets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  contact-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Generate original-form contact sheets
        shell: bash
        run: |
          for c in atlas pixel ink sterling forge porter echo; do
            npm run ip:contact-sheet -- --faction=heroes --character=$c --form=original
          done
          for c in director counterfeiter restorer hacker hoarder vault whisper smuggler; do
            npm run ip:contact-sheet -- --faction=villains --character=$c --form=original
          done
      - name: Generate available humanized contact sheets
        shell: bash
        run: |
          for c in atlas pixel ink sterling forge porter echo; do
            dir="characters/heroes/$c/humanized/poses/approved"
            if compgen -G "$dir/*.png" > /dev/null; then
              npm run ip:contact-sheet -- --faction=heroes --character="$c" --form=humanized
            fi
          done
          for c in director counterfeiter restorer hacker hoarder vault whisper smuggler; do
            dir="characters/villains/$c/humanized/poses/approved"
            if compgen -G "$dir/*.png" > /dev/null; then
              npm run ip:contact-sheet -- --faction=villains --character="$c" --form=humanized
            fi
          done
      - name: Commit contact sheets
        shell: bash
        run: |
          git config user.name 'collectiverse-reconciliation[bot]'
          git config user.email 'reconciliation@users.noreply.github.com'
          git restore package-lock.json package.json 2>/dev/null || true
          git add characters/*/*/*/contact-sheet/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: generate canonical character contact sheets"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
