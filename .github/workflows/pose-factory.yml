name: Collectiverse Pose Factory

on:
  workflow_dispatch:
    inputs:
      character:
        description: 'Character id'
        required: true
        default: sterling
  push:
    paths:
      - 'tools/pose-factory/queue/*.request'

permissions:
  contents: write

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  generate-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve character
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHARACTER='${{ inputs.character }}'
          else
            REQUEST=$(ls -t tools/pose-factory/queue/*.request | head -1)
            CHARACTER=$(tr -d '[:space:]' < "$REQUEST")
          fi
          if [ -z "$CHARACTER" ]; then echo 'No character resolved' >&2; exit 1; fi
          echo "character=$CHARACTER" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify API secret exists
        run: test -n "$OPENAI_API_KEY"

      - name: Generate to canonical staging
        run: npx tsx tools/pose-factory/scripts/generate-poses.ts --character=${{ steps.target.outputs.character }}

      - name: Visual QA gate
        run: npx tsx tools/pose-factory/scripts/qa-poses.ts --character=${{ steps.target.outputs.character }}

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pose-factory-${{ steps.target.outputs.character }}-${{ github.run_number }}
          path: |
            characters/*/${{ steps.target.outputs.character }}/humanized/poses/
            tools/pose-factory/qa/${{ steps.target.outputs.character }}-latest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit staged QA results
        if: always()
        shell: bash
        run: |
          git config user.name 'collectiverse-pose-factory[bot]'
          git config user.email 'pose-factory@users.noreply.github.com'
          git add characters/*/${{ steps.target.outputs.character }}/humanized/poses/ tools/pose-factory/qa/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "poses(${{ steps.target.outputs.character }}): stage and QA humanized assets"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
