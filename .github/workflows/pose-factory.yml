name: Collectiverse Pose Factory

on:
  workflow_dispatch:
    inputs:
      character:
        description: 'Character id'
        required: true
        default: sterling
  push:
    paths:
      - 'pose-factory/queue/*.request'

permissions:
  contents: write

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve character
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHARACTER='${{ inputs.character }}'
          else
            REQUEST=$(ls -t pose-factory/queue/*.request | head -1)
            CHARACTER=$(tr -d '[:space:]' < "$REQUEST")
          fi
          if [ -z "$CHARACTER" ]; then echo 'No character resolved' >&2; exit 1; fi
          echo "character=$CHARACTER" >> "$GITHUB_OUTPUT"
          echo "Generating character: $CHARACTER"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify API secret exists
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY GitHub Actions secret is missing.' >&2
            exit 1
          fi

      - name: Generate missing poses
        run: npx tsx pose-factory/scripts/generate-poses.ts --character=${{ steps.target.outputs.character }}

      - name: Upload generated poses artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pose-factory-${{ steps.target.outputs.character }}-${{ github.run_number }}
          path: pose-factory/output/${{ steps.target.outputs.character }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated PNGs
        if: success()
        shell: bash
        run: |
          git config user.name 'collectiverse-pose-factory[bot]'
          git config user.email 'pose-factory@users.noreply.github.com'
          git add pose-factory/output/${{ steps.target.outputs.character }}/
          if git diff --cached --quiet; then
            echo 'No new generated files to commit.'
            exit 0
          fi
          git commit -m "poses(${{ steps.target.outputs.character }}): generate humanized pose assets"
          git pull --rebase origin main
          git push origin main
